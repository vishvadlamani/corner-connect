[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "node_kit"
version = "0.1.0"
description = "Parametric design-space exploration for a cast steel corner node in an LGSF kit system. Units: mm, N, MPa."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cadquery>=2.4",
    "gmsh>=4.11",
    "meshio>=5.3",
    "pymoo>=0.6",
    "pandas>=2.0",
    "pyarrow>=14",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "validation"]
addopts = "-ra"
